name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    # Linux x86-64 with real GCC and clang: the run corpus and the runtime agreement harness
    # build every program with clang and GCC (O0/O2/portable-overflow) and clang ASan+UBSan.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Toolchain versions
        run: |
          dotnet --version
          clang --version | head -1
          gcc --version | head -1
      - name: Build
        run: dotnet build Nova.slnx -c Release
      - name: No crash reports
        # Panics abort, and the run-fail tests and fault-injection sweeps abort hundreds of times. Ubuntu
        # pipes each abort to apport/systemd-coredump, which exhausted the runner's memory (M6e). A pipe
        # ignores `ulimit -c 0`, so switch to a plain core pattern, which the limit below then disables.
        run: |
          sudo systemctl stop apport.service || true
          sudo sysctl -w kernel.core_pattern=core
      - name: Test
        run: |
          ulimit -c 0
          echo "cores: $(nproc)"; free -m; ulimit -a | grep -E "core|processes|open files"
          # Resource samples go to this step's own log, so they survive a killed job (diagnoses stalls).
          (while true; do echo "[res] $(date -u +%T) $(free -m | awk '/Mem/{print "used=" $3 "MB avail=" $7 "MB"}') load=$(cut -d' ' -f1-3 /proc/loadavg) zombies=$(ps -eo stat | grep -c '^Z')"; ps -eo rss,pcpu,etime,comm --sort=-pcpu | sed -n 2,4p | sed 's/^/[res]   /'; sleep 15; done) &
          dotnet test Nova.slnx -c Release --no-build --logger "console;verbosity=normal"

  test-windows:
    # MSVC, best effort (docs/c-backend.md §1.1): the run corpus built with cl /std:c11 /W3 /WX and run.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Toolchain versions
        shell: pwsh
        run: |
          dotnet --version
          cl 2>&1 | Select-Object -First 1
      - name: Test
        shell: pwsh
        env:
          NOVA_MSVC: "1"
        run: dotnet test tests/Nova.Compiler.Tests -c Release --filter "FullyQualifiedName~MsvcTests" --logger "console;verbosity=normal"
